<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeed reTerminal E1001 - Crypto Dashboard</title>
  <!-- Google Fonts: Roboto Bold & Regular -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- p5.js Core Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <h1 class="title">Seeed reTerminal E1001 &bull; Crypto Dashboard</h1>
        <span class="badge badge-live" id="api-status-badge">API: Connected</span>
        <span class="badge">800 &times; 480 E-Paper</span>
      </div>
      <div class="header-right">
        <span id="seed-display" class="badge">Seed: 1001</span>
        <span id="version-display" class="version-tag">v2026.09.22.10.46.00</span>
      </div>
    </header>

    <main class="canvas-wrapper">
      <div id="eink-canvas-container" class="eink-bezel">
        <!-- p5.js canvas will be injected here -->
      </div>
    </main>

    <footer class="app-controls">
      <!-- Row 1: Symbol configuration & Time Mode & Refresh -->
      <div class="control-row">
        <div class="control-group">
          <label for="symbols-input">Symbols:</label>
          <input type="text" id="symbols-input" class="styled-input" placeholder="e.g. BTC,ETH,ADA" value="BTC,ETH,ADA">
          <button id="btn-update-symbols" class="btn btn-secondary">Apply</button>
        </div>

        <div class="control-group">
          <label for="time-format-select">Time:</label>
          <select id="time-format-select" class="styled-select">
            <option value="12" selected>12-Hour (AM/PM)</option>
            <option value="24">24-Hour</option>
          </select>
        </div>

        <div class="button-group">
          <button id="btn-refresh" class="btn btn-secondary">🔄 Refresh (<span id="refresh-countdown">60</span>s)</button>
        </div>
      </div>

      <!-- Row 2: Visual Theming & E-Ink Controls -->
      <div class="control-row">
        <div class="control-group">
          <label for="palette-select">Palette:</label>
          <select id="palette-select" class="styled-select">
            <option value="0" selected>0: Monochrome Minimalist</option>
            <option value="1">1: Charcoal & Slate</option>
            <option value="2">2: High Contrast 1-Bit</option>
            <option value="3">3: Carbon Modern</option>
            <option value="4">4: Stipple Ink Tones</option>
          </select>
        </div>

        <div class="control-group">
          <label for="bg-select">Background:</label>
          <select id="bg-select" class="styled-select">
            <option value="0" selected>Tone 0 (Crisp Light)</option>
            <option value="1">Tone 1 (Light Tint)</option>
            <option value="2">Tone 2 (Mid Neutral)</option>
            <option value="3">Tone 3 (Dark Gray)</option>
            <option value="4">Tone 4 (Pure Black)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="battery-slider">Battery:</label>
          <input type="range" id="battery-slider" class="styled-range" min="5" max="100" value="88">
          <span id="battery-val" style="font-family: monospace; font-size: 0.8rem;">88%</span>
        </div>

        <div class="button-group">
          <button id="btn-reseed" class="btn btn-secondary">New Seed</button>
          <button id="btn-dither" class="btn btn-secondary">1-Bit Dither</button>
          <button id="btn-export" class="btn btn-primary">Export PNG</button>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <span class="status-text" id="status-info">Source: CoinMarketCap API &bull; Cache: 60s TTL &bull; Font: Roboto Bold</span>
        <span class="status-text" id="status-time">Last update: --:--:--</span>
      </div>
    </footer>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
