<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeed reTerminal E1001 - Google Tasks Dashboard</title>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- p5.js Core Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <h1 class="title">Seeed reTerminal E1001 &bull; Google Tasks Feed</h1>
        <span class="badge badge-live" id="api-status-badge">Feed: Initializing</span>
        <span class="badge">800 &times; 480 E-Paper</span>
      </div>
      <div class="header-right">
        <span id="seed-display" class="badge">Seed: 1001</span>
        <span id="version-display" class="version-tag">v2026.09.27.11.30.00</span>
      </div>
    </header>

    <main class="canvas-wrapper">
      <div id="eink-canvas-container" class="eink-bezel">
        <!-- p5.js canvas injected here -->
      </div>
    </main>

    <footer class="app-controls">
      <!-- Row 1: Task Filter & Time Format & Refresh -->
      <div class="control-row">
        <div class="control-group">
          <label for="filter-select">View Filter:</label>
          <select id="filter-select" class="styled-select">
            <option value="all" selected>All Tasks</option>
            <option value="pending">Pending Only</option>
            <option value="today">Due Today / Overdue</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="control-group">
          <label for="time-format-select">Time Format:</label>
          <select id="time-format-select" class="styled-select">
            <option value="12" selected>12-Hour (AM/PM)</option>
            <option value="24">24-Hour</option>
          </select>
        </div>

        <div class="button-group">
          <button id="btn-refresh" class="btn btn-secondary">🔄 Refresh (<span id="refresh-countdown">60</span>s)</button>
        </div>
      </div>

      <!-- Row 2: Visual Theming & E-Ink Controls -->
      <div class="control-row">
        <div class="control-group">
          <label for="palette-select">Palette:</label>
          <select id="palette-select" class="styled-select">
            <option value="0" selected>0: Monochrome E-Paper</option>
            <option value="1">1: Charcoal &amp; Mist</option>
            <option value="2">2: Nordic Minimalist</option>
            <option value="3">3: Carbon &amp; Warm Slate</option>
            <option value="4">4: High Contrast 1-Bit</option>
          </select>
        </div>

        <div class="control-group">
          <label for="bg-select">Background:</label>
          <select id="bg-select" class="styled-select">
            <option value="0" selected>Light Base (Tone 0)</option>
            <option value="1">Subtle Base (Tone 1)</option>
            <option value="4">Dark Inversion (Tone 4)</option>
          </select>
        </div>

        <div class="button-group">
          <button id="btn-dither" class="btn btn-toggle">Dither: Off</button>
          <button id="btn-reseed" class="btn btn-secondary">🎲 Reseed</button>
          <button id="btn-export" class="btn btn-secondary">📸 Save PNG</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Shared E1001 Common Library -->
  <script src="/common/e1001-common.js"></script>
  <!-- Main Sketch -->
  <script src="sketch.js"></script>
</body>
</html>
