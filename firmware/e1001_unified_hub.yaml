# ============================================================================
# E-INK DISPLAY DRIVER (WAVESHARE 7.50IN V2 - 800x480)
# ============================================================================
display:
  - platform: waveshare_epaper
    id: eink_display
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      inverted: true
    model: 7.50inv2
    update_interval: never
    rotation: 0
    lambda: |-
      Color c_bg = id(dark_mode) ? COLOR_ON : COLOR_OFF;
      Color c_fg = id(dark_mode) ? COLOR_OFF : COLOR_ON;
      it.fill(c_bg);

      int mod = id(active_module_index);

      // Current time from SNTP / PCF8563 RTC
      auto time_now = id(sntp_time).now();
      if (!time_now.is_valid()) {
        time_now = id(pcf_rtc).now();
      }
      int cur_hour = time_now.hour;
      int cur_min = time_now.minute;
      int cur_day = time_now.day_of_month;
      int cur_month = time_now.month;
      int cur_day_of_week = time_now.day_of_week;

      // ============================================================================
      // MODULE 0: NATIVE WEATHER DASHBOARD
      // ============================================================================
      if (mod == 0) {
        int margin_x = 20;

        // Top Header (Left: Location & Current Temp)
        it.printf(margin_x, 14, id(font_title), c_fg, "%s", id(loc_name).c_str());

        int temp_val = id(cur_temp_c);
        if (id(use_fahrenheit)) temp_val = (int)((temp_val * 9.0f / 5.0f) + 32.0f);
        it.printf(margin_x, 44, id(font_huge), c_fg, "%d°%s", temp_val, id(use_fahrenheit) ? "F" : "C");

        // Header Subtitle: Condition, Humidity (Font >= 18px)
        const char* cond_label = "Mainly Clear";
        int w_code = id(cur_weather_code);
        if (w_code == 0) cond_label = "Clear Sky";
        else if (w_code == 1 || w_code == 2) cond_label = "Partly Cloudy";
        else if (w_code == 3) cond_label = "Overcast";
        else if (w_code >= 45 && w_code <= 48) cond_label = "Foggy";
        else if (w_code >= 51 && w_code <= 67) cond_label = "Rain Showers";
        else if (w_code >= 71 && w_code <= 77) cond_label = "Snow";
        else if (w_code >= 80 && w_code <= 82) cond_label = "Heavy Rain";
        else if (w_code >= 95) cond_label = "Thunderstorm";

        it.printf(margin_x, 108, id(font_body), c_fg, "%s  |  Humidity: %d%%", cond_label, id(cur_humidity));

        // Top Header (Right: Live Clock & Date)
