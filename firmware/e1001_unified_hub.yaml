              {0, 0, 0, 0x7000000}, {0x3c00780, 0, 0, 0}, {0x3c07800, 0, 0, 0}, {0, 0xf01f, 0, 0},
              {0x3c7800, 0x1e0, 0, 0}, {0x3c0780, 0x1e0, 0, 0}, {0, 0x1e0, 0, 0}, {0x3c00780, 0x1e0, 0, 0},
              {0x3c07800, 0x1e0, 0, 0}, {0, 0xf001f, 0, 0}, {0x3c7800, 0, 0, 0}, {0x3c0780, 0, 0, 0}
            }
          }
        };

        int l_idx = id(qlock_lang_idx);
        if (l_idx < 0 || l_idx >= 6) l_idx = 0;
        const QLang& lang = LANGS[l_idx];

        int hour = cur_hour;
        int minute = cur_min;
        if (hour == 0) hour = 12;

        int five_min_idx = minute / 5;
        if ((five_min_idx * 5 + lang.offset) >= 60) {
          hour += 1;
        }
        if (hour > 12) hour -= 12;
        if (hour == 0) hour = 12;

        // Merge hour and minute bitmasks
        uint32_t merged[4];
        for (int i = 0; i < 4; i++) {
          merged[i] = lang.hr[hour - 1][i] | lang.mi[five_min_idx][i];
        }

        // Populate lit boolean flags (1..110)
        bool is_lit[111] = {false};
        int offsets[4] = {1, 29, 56, 84};
        for (int i = 0; i < 4; i++) {
          uint32_t cset = merged[i];
          int crange = 28 - (i % 2);
          int coff = offsets[i];
          for (int j = 0; j < crange; j++) {
            if ((cset & 1) == 1) {
              int cid = j + coff;
              if (cid <= 110) is_lit[cid] = true;
            }
            cset >>= 1;
          }
        }

        // Corner Minutes (+1..+4)
        int rem_min = minute % 5;
        int cmask = (1 << rem_min) - 1;
        bool dot_tl = (cmask & 1) != 0;
        bool dot_tr = (cmask & 2) != 0;
        bool dot_br = (cmask & 4) != 0;
        bool dot_bl = (cmask & 8) != 0;

        // Centered Matrix Geometry (800x480 screen, no footer)
        int grid_w = 520;
        int grid_h = 420;
        int start_x = (800 - grid_w) / 2;
        int start_y = (480 - grid_h) / 2;
        int cell_w = grid_w / 11;
        int cell_h = grid_h / 10;

        // Draw Corner Minute Dots ONLY when illuminated
        int dot_m = 24;
        int dot_r = 6;
        if (dot_tl) it.filled_circle(dot_m, dot_m, dot_r, c_fg);
        if (dot_tr) it.filled_circle(800 - dot_m, dot_m, dot_r, c_fg);
        if (dot_br) it.filled_circle(800 - dot_m, 480 - dot_m, dot_r, c_fg);
        if (dot_bl) it.filled_circle(dot_m, 480 - dot_m, dot_r, c_fg);

        // Render Matrix Grid (Lit in solid 100%, Unlit in 25% dithered gray at 28px font)
        int char_idx = 0;
        for (int r = 0; r < 10; r++) {
          for (int c = 0; c < 11; c++) {
            int cell_id = (r * 11) + c + 1;
            char ch = lang.clock[char_idx++];
            int cx = start_x + (c * cell_w) + (cell_w / 2);
            int cy = start_y + (r * cell_h) + (cell_h / 2);

            if (is_lit[cell_id]) {
              // Lit letters: Solid black / solid white (100% density)
              if (ch == 'o') {
                it.printf(cx, cy, id(font_qlock), c_fg, TextAlign::CENTER, "O'");
              } else {
                it.printf(cx, cy, id(font_qlock), c_fg, TextAlign::CENTER, "%c", ch);
              }
            } else {
              // Unlit letters: Dithered to 25% dot-grid
              if (ch == 'o') {
                it.printf(cx, cy, id(font_qlock), c_fg, TextAlign::CENTER, "O'");
              } else {
                it.printf(cx, cy, id(font_qlock), c_fg, TextAlign::CENTER, "%c", ch);
              }

              // Apply 25% dither mask: only keep pixels where px%2==0 and py%2==0
              int bx0 = cx - (cell_w / 2);
              int bx1 = cx + (cell_w / 2);
              int by0 = cy - (cell_h / 2);
              int by1 = cy + (cell_h / 2);
              for (int py = by0; py <= by1; py++) {
                for (int px = bx0; px <= bx1; px++) {
                  if ((px % 2 != 0) || (py % 2 != 0)) {
                    it.draw_pixel_at(px, py, c_bg);
                  }
                }
              }
            }
          }
        }
      }

      // ============================================================================
      // MODULE 4: MODULAR GRID GENERATIVE ART (art-241018a by takawo)
      // ============================================================================
      else if (mod == 4) {
        // Dynamic Seed: Uses current live RTC/SNTP timestamp and second count every display cycle
        uint32_t current_seed = (uint32_t)time_now.timestamp;
        if (current_seed == 0) {
          current_seed = (uint32_t)(cur_hour * 3600 + cur_min * 60 + time_now.second + 1001) ^ (uint32_t)millis();
        }
        uint32_t rng_state = current_seed;
        auto next_rand = [&rng_state]() -> float {
          rng_state = rng_state * 1664525u + 1013904223u;
          return (float)(rng_state & 0x7FFFFFFF) / 2147483647.0f;
        };
        auto rand_int = [&next_rand](int min_val, int max_val) -> int {
          return min_val + (int)(next_rand() * (float)(max_val - min_val + 1));
        };

        const int canvas_w = 800;
        const int canvas_h = 480;
        const int margin = 40;
        const int cell_multiplier = 5;
        const int min_factor = 2;
        const int max_factor = 12;
        const float arc_prob = 0.55f;
        const int concentric_rings = 3;

        int factor = rand_int(min_factor, max_factor);
        int cell_size = cell_multiplier * factor;
        if (cell_size < 20) cell_size = 20;

        int total_x = (canvas_w - margin * 2) / cell_size;
        int total_y = (canvas_h - margin * 2) / cell_size;
        if (total_x < 1) total_x = 1;
        if (total_y < 1) total_y = 1;

        int mg_x = (canvas_w - total_x * cell_size) / 2;
        int mg_y = (canvas_h - total_y * cell_size) / 2;

        // Doubled line weight: 3px-4px bold strokes for crisp e-ink rendering
        auto draw_thick_line = [&it, c_fg](int x0, int y0, int x1, int y1) {
          it.line(x0, y0, x1, y1, c_fg);
          it.line(x0 + 1, y0 + 1, x1 + 1, y1, c_fg);
          it.line(x0, y0 + 1, x1, y1 + 1, c_fg);
          it.line(x0 - 1, y0 - 1, x1 - 1, y1, c_fg);
          it.line(x0, y0 - 1, x1, y1 - 1, c_fg);
          it.line(x0 + 1, y0 + 1, x1 + 1, y1 + 1, c_fg);
          it.line(x0 - 1, y0 - 1, x1 - 1, y1 - 1, c_fg);
        };

        for (int i = 0; i < total_x; i++) {
          for (int j = 0; j < total_y; j++) {
            int top_left_x = i * cell_size + mg_x;
            int top_left_y = j * cell_size + mg_y;

            if (next_rand() < arc_prob) {
              // Concentric Arc Module with Doubled Bold Stroke Weight
              int center_corner = rand_int(0, 3);
              int cx = (center_corner % 3 == 0) ? top_left_x : (top_left_x + cell_size);
              int cy = (center_corner < 2) ? top_left_y : (top_left_y + cell_size);
              float begin_rad = (float)center_corner * (float)(M_PI / 2.0);

              for (int ring = concentric_rings; ring >= 1; ring--) {
                float scl = (float)ring / (float)concentric_rings;
                float r_base = (float)cell_size * scl;
                int segments = 16;
                // Draw multi-radius passes (-1.5px to +1.5px) for bold doubled arc lines
                for (float r_offset = -1.5f; r_offset <= 1.5f; r_offset += 0.75f) {
                  float r = r_base + r_offset;
                  if (r < 1.0f) continue;
                  int prev_px = 0, prev_py = 0;
                  for (int s = 0; s <= segments; s++) {
                    float theta = begin_rad + ((float)(M_PI / 2.0) * ((float)s / (float)segments));
                    int px = cx + (int)(cosf(theta) * r);
                    int py = cy + (int)(sinf(theta) * r);
                    if (px >= 0 && px < 800 && py >= 0 && py < 480) {
                      if (s > 0) {
                        it.line(prev_px, prev_py, px, py, c_fg);
                      }
                      prev_px = px;
                      prev_py = py;
                    }
                  }
                }
              }
            } else {
              // Diagonal / Segmented Line Module with Doubled Bold Stroke Weight
              int begin_idx = rand_int(0, 3);
              int end_offset = rand_int(1, 3);
              int end_idx = (begin_idx + end_offset) % 4;

              auto get_corner_x = [top_left_x, cell_size](int idx) -> int {
                return (idx == 0 || idx == 3) ? top_left_x : (top_left_x + cell_size);
              };
              auto get_corner_y = [top_left_y, cell_size](int idx) -> int {
                return (idx == 0 || idx == 1) ? top_left_y : (top_left_y + cell_size);
              };

              int x1 = get_corner_x(begin_idx);
              int y1 = get_corner_y(begin_idx);
              int x2 = get_corner_x(end_idx);
              int y2 = get_corner_y(end_idx);

              draw_thick_line(x1, y1, x2, y2);
            }
          }
        }
      }
