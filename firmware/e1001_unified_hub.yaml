# ============================================================================
# Seeed reTerminal E1001 - Unified Native ESPHome Multi-Module Dashboard
# Version: 2026.09.29.17.00.00
# Description: 100% Autonomous, on-device multi-module dashboard for Seeed E1001
#              (ESP32-S3 + Waveshare 7.50in V2 800x480 e-paper display).
#              Runs 100% standalone without any computer or host server.
#
# Integrated Modules:
#   Module 0: Live Open-Meteo Weather Dashboard (5-Day Outlook + SVG Icons)
#   Module 1: Authentic Typographic QLOCKTWO Word Clock (6 Languages + RTC Sync)
#   Module 2: Cryptocurrency Asset Market Tracker (Spot Quotes & 24h Deltas)
#   Module 3: Algorithmic Generative Art (Harmonics, Streamlines, Rosettes)
#
# Hardware Button Controls:
#   - GPIO4 (Next Button):   Switch to Next Module
#   - GPIO5 (Prev Button):   Switch to Previous Module
#   - GPIO3 (Action Button): Sub-module toggle (°C/°F, Lang, Invert, New Seed)
# ============================================================================

substitutions:
  name: "seeed-e1001-unified-hub"
  friendly_name: "Seeed E1001 Unified Hub"
  default_lat: "21.0285"
  default_lon: "105.8542"
  default_city: "Hanoi, VN"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 800
    then:
      - output.turn_on: sd_cs_pin
      - output.turn_off: sd_en_pin
      - output.turn_on: batt_en_pin
      - delay: 300ms
      - pcf8563.read_time:
      - delay: 300ms
      - component.update: batt_voltage
      - delay: 200ms
      - component.update: eink_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# ============================================================================
# GLOBAL STATE VARIABLES (ZERO MAGIC NUMBERS)
# ============================================================================
globals:
  # Active Display Module (0: Weather, 1: QLOCKTWO, 2: Crypto, 3: Generative Art)
  - id: active_module_index
    type: int
    restore_value: true
    initial_value: '0'

  # Auto-cycle between modules
  - id: auto_cycle_enabled
    type: bool
    restore_value: true
    initial_value: 'false'

  # Universal Inverted / Dark Theme Toggle
  - id: dark_mode
    type: bool
    restore_value: true
    initial_value: 'false'

  # Clock & Unit Format Preferences
  - id: use_24h_time
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: use_fahrenheit
    type: bool
    restore_value: true
    initial_value: 'false'

  # QLOCKTWO Language (0: EN, 1: DE, 2: FR, 3: ES, 4: IT, 5: NL)
  - id: qlock_lang_idx
    type: int
    restore_value: true
    initial_value: '0'

  # Generative Art State
  - id: art_design_idx
    type: int
    restore_value: true
    initial_value: '0'
  - id: art_seed
    type: int
    restore_value: true
    initial_value: '1001'

  # Weather Module Dynamic State
  - id: loc_name
    type: std::string
    restore_value: true
    initial_value: '"${default_city}"'
  - id: cur_temp_c
    type: int
    initial_value: '28'
  - id: cur_weather_code
    type: int
    initial_value: '1'
  - id: cur_humidity
    type: int
    initial_value: '68'
  - id: fc_max_0
    type: int
    initial_value: '31'
  - id: fc_max_1
    type: int
    initial_value: '30'
  - id: fc_max_2
    type: int
    initial_value: '29'
  - id: fc_max_3
    type: int
    initial_value: '32'
  - id: fc_max_4
    type: int
    initial_value: '31'
  - id: fc_min_0
    type: int
    initial_value: '24'
  - id: fc_min_1
    type: int
    initial_value: '24'
  - id: fc_min_2
    type: int
    initial_value: '23'
  - id: fc_min_3
    type: int
    initial_value: '24'
  - id: fc_min_4
    type: int
    initial_value: '25'
  - id: fc_code_0
    type: int
    initial_value: '1'
  - id: fc_code_1
    type: int
    initial_value: '2'
  - id: fc_code_2
    type: int
    initial_value: '61'
  - id: fc_code_3
    type: int
    initial_value: '80'
  - id: fc_code_4
    type: int
    initial_value: '3'

  # Crypto Module Dynamic State
  - id: btc_price
    type: float
    initial_value: '84250.0'
  - id: btc_change_24h
    type: float
    initial_value: '2.01'
  - id: eth_price
    type: float
    initial_value: '2718.5'
  - id: eth_change_24h
    type: float
    initial_value: '3.05'
  - id: ada_price
    type: float
    initial_value: '0.254'
  - id: ada_change_24h
    type: float
    initial_value: '4.64'

# ============================================================================
# LOGGING & WI-FI SETUP
# ============================================================================
logger:
  hardware_uart: UART0
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "E1001-Hub-Fallback"
    password: "fallbackpassword"
  on_connect:
    then:
      - delay: 1s
      # 1. IP Geolocation for Weather
      - http_request.get:
          url: "http://ip-api.com/json"
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject doc) {
                    if (doc["city"].is<const char*>() && doc["countryCode"].is<const char*>()) {
                      std::string city = doc["city"].as<std::string>();
                      std::string cc = doc["countryCode"].as<std::string>();
                      id(loc_name) = city + ", " + cc;
                    }
                    if (doc["lat"].is<float>() && doc["lon"].is<float>()) {
                      float lat = doc["lat"].as<float>();
                      float lon = doc["lon"].as<float>();
                      char url_buf[256];
                      snprintf(url_buf, sizeof(url_buf),
                               "http://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto",
                               lat, lon);
                      id(fetch_weather_script).execute(std::string(url_buf));
                    }
                    return true;
                  });
      # 2. Fetch Crypto Quotes
      - script.execute: fetch_crypto_script

captive_portal:

# ============================================================================
# HTTP REST API CLIENT & SCRIPTS (Large buffer to receive full CMC quotes)
# ============================================================================
http_request:
  id: http_client
  verify_ssl: false
  timeout: 15s
  buffer_size_rx: 8192

script:
  # Fetch Open-Meteo Weather Data
  - id: fetch_weather_script
    mode: restart
    parameters:
      weather_url: string
    then:
      - http_request.get:
          url: !lambda return weather_url;
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject doc) {
                    if (doc["current"].is<JsonObject>()) {
                      auto cur = doc["current"];
                      id(cur_temp_c) = (int)round(cur["temperature_2m"].as<float>());
                      id(cur_humidity) = (int)round(cur["relative_humidity_2m"].as<float>());
                      id(cur_weather_code) = cur["weather_code"].as<int>();
                    }
                    if (doc["daily"].is<JsonObject>()) {
                      auto daily = doc["daily"];
                      auto codes = daily["weather_code"].as<JsonArray>();
                      auto t_max = daily["temperature_2m_max"].as<JsonArray>();
                      auto t_min = daily["temperature_2m_min"].as<JsonArray>();
                      if (codes.size() >= 5) {
                        id(fc_code_0) = codes[0].as<int>();
                        id(fc_code_1) = codes[1].as<int>();
                        id(fc_code_2) = codes[2].as<int>();
                        id(fc_code_3) = codes[3].as<int>();
                        id(fc_code_4) = codes[4].as<int>();
                      }
                      if (t_max.size() >= 5) {
                        id(fc_max_0) = (int)round(t_max[0].as<float>());
                        id(fc_max_1) = (int)round(t_max[1].as<float>());
                        id(fc_max_2) = (int)round(t_max[2].as<float>());
                        id(fc_max_3) = (int)round(t_max[3].as<float>());
                        id(fc_max_4) = (int)round(t_max[4].as<float>());
                      }
                      if (t_min.size() >= 5) {
                        id(fc_min_0) = (int)round(t_min[0].as<float>());
                        id(fc_min_1) = (int)round(t_min[1].as<float>());
                        id(fc_min_2) = (int)round(t_min[2].as<float>());
                        id(fc_min_3) = (int)round(t_min[3].as<float>());
                        id(fc_min_4) = (int)round(t_min[4].as<float>());
                      }
                    }
                    return true;
                  });
              - if:
                  condition:
                    lambda: 'return id(active_module_index) == 0;'
                  then:
                    - component.update: eink_display

  # Fetch Crypto Quotes from CoinMarketCap (with 8KB response buffer)
  - id: fetch_crypto_script
    mode: restart
    then:
      - http_request.get:
          url: "https://pro-api.coinmarketcap.com/v1/cryptocurrency/quotes/latest?symbol=BTC,ETH,ADA"
          request_headers:
            X-CMC_PRO_API_KEY: !secret cmc_api_key
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject doc) {
                    if (doc["data"].is<JsonObject>()) {
                      auto data = doc["data"];
                      if (data["BTC"].is<JsonObject>()) {
                        auto btc = data["BTC"]["quote"]["USD"];
                        id(btc_price) = btc["price"].as<float>();
                        id(btc_change_24h) = btc["percent_change_24h"].as<float>();
                      }
                      if (data["ETH"].is<JsonObject>()) {
                        auto eth = data["ETH"]["quote"]["USD"];
                        id(eth_price) = eth["price"].as<float>();
                        id(eth_change_24h) = eth["percent_change_24h"].as<float>();
                      }
                      if (data["ADA"].is<JsonObject>()) {
                        auto ada = data["ADA"]["quote"]["USD"];
                        id(ada_price) = ada["price"].as<float>();
                        id(ada_change_24h) = ada["percent_change_24h"].as<float>();
                      }
                    }
                    return true;
                  });
              - if:
                  condition:
                    lambda: 'return id(active_module_index) == 2;'
                  then:
                    - component.update: eink_display

# ============================================================================
# HARDWARE PINS & BUSES
# ============================================================================
output:
  - platform: gpio
    pin: GPIO14
    id: sd_cs_pin
  - platform: gpio
    pin: GPIO16
    id: sd_en_pin
  - platform: gpio
    pin: GPIO21
    id: batt_en_pin

# NXP PCF8563 Real-Time Clock I2C Bus
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

time:
  # Hardware PCF8563 RTC Driver
  - platform: pcf8563
    id: pcf_rtc
    address: 0x51

  # Network SNTP Time Sync (Timezone: Asia/Bangkok)
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    on_time_sync:
      then:
        - pcf8563.write_time:
        - delay: 500ms
        - component.update: eink_display
    on_time:
      # Top of the minute update (:00s)
      - seconds: 0
        then:
          - lambda: |-
              if (id(auto_cycle_enabled)) {
                id(active_module_index) = (id(active_module_index) + 1) % 4;
              }
          - component.update: eink_display
      # Periodic weather refresh every 15 minutes
      - minutes: "/15"
        seconds: 10
        then:
          - script.execute:
              id: fetch_weather_script
              weather_url: "http://api.open-meteo.com/v1/forecast?latitude=${default_lat}&longitude=${default_lon}&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto"
      # Periodic crypto refresh every 5 minutes
      - minutes: "/5"
        seconds: 25
        then:
          - script.execute: fetch_crypto_script

# Hardware Battery ADC Sensor
sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: batt_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0

  - platform: template
    name: "Battery Percentage"
    id: batt_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    update_interval: 60s
    lambda: |-
      if (!id(batt_voltage).has_state()) return 85.0f;
      float v = id(batt_voltage).state;
      if (isnan(v) || v <= 0.2f) return 85.0f;
      if (v < 2.5f) v = v * 2.0f;
      if (v >= 4.15f) return 100.0f;
      if (v <= 3.30f) return 5.0f;
      float pct = ((v - 3.30f) / (4.15f - 3.30f)) * 100.0f;
      return (float)std::max(5.0f, std::min(100.0f, pct));

# ============================================================================
# PHYSICAL HARDWARE BUTTONS
# ============================================================================
binary_sensor:
  # Next Button (GPIO4): Advance to Next Module
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Next Button"
    on_press:
      then:
        - lambda: |-
            id(active_module_index) = (id(active_module_index) + 1) % 4;
        - component.update: eink_display

  # Prev Button (GPIO5): Return to Previous Module
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Prev Button"
    on_press:
      then:
        - lambda: |-
            id(active_module_index) = (id(active_module_index) + 3) % 4;
        - component.update: eink_display

  # Action Button (GPIO3): Contextual Sub-Action per Module
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Action Button"
    on_press:
      then:
        - lambda: |-
            int cur = id(active_module_index);
            if (cur == 0) {
              // Weather: Toggle °C / °F
              id(use_fahrenheit) = !id(use_fahrenheit);
            } else if (cur == 1) {
              // Qlocktwo: Cycle Language
              id(qlock_lang_idx) = (id(qlock_lang_idx) + 1) % 6;
            } else if (cur == 2) {
              // Crypto: Toggle Invert Theme
              id(dark_mode) = !id(dark_mode);
            } else if (cur == 3) {
              // Art: Reseed & Cycle Style
              id(art_design_idx) = (id(art_design_idx) + 1) % 3;
              id(art_seed) = (int)(esp_random() % 100000) + 1;
            }
        - component.update: eink_display

# Hardware SPI for Display
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Weather SVG Icons
image:
  - file: "assets/icons/sun.svg"
    id: img_sun
    resize: 42x42
    type: BINARY
  - file: "assets/icons/cloud-sun.svg"
    id: img_cloud_sun
    resize: 42x42
    type: BINARY
  - file: "assets/icons/cloud.svg"
    id: img_cloud
    resize: 42x42
    type: BINARY
  - file: "assets/icons/cloud-rain.svg"
    id: img_cloud_rain
    resize: 42x42
    type: BINARY
  - file: "assets/icons/cloud-lightning.svg"
    id: img_cloud_lightning
    resize: 42x42
    type: BINARY
  - file: "assets/icons/cloud-snow.svg"
    id: img_cloud_snow
    resize: 42x42
    type: BINARY
  - file: "assets/icons/cloud-fog.svg"
    id: img_cloud_fog
    resize: 42x42
    type: BINARY
  - file: "assets/icons/moon.svg"
    id: img_moon
    resize: 42x42
    type: BINARY

# Clean Sans-Serif Fonts (Roboto Bold) - Strictly >= 18px
font:
  - file: "assets/fonts/Roboto-Bold.ttf"
    id: font_huge
    size: 54
    glyphs: "0123456789° %/:-.,|#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜÉÈÇÀ+$"

  - file: "assets/fonts/Roboto-Bold.ttf"
    id: font_large
    size: 40
    glyphs: "0123456789° %/:-.,|#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜÉÈÇÀ+$"

  - file: "assets/fonts/Roboto-Bold.ttf"
    id: font_qlock
    size: 28
    glyphs: "0123456789° %/:-.,|'#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜÉÈÇÀ+$"

  - file: "assets/fonts/Roboto-Bold.ttf"
    id: font_title
    size: 24
    glyphs: "0123456789° %/:-.,|#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜÉÈÇÀ+$"

  - file: "assets/fonts/Roboto-Bold.ttf"
    id: font_subtitle
    size: 20
    glyphs: "0123456789° %/:-.,|#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜÉÈÇÀ+$"

  - file: "assets/fonts/Roboto-Bold.ttf"
    id: font_body
    size: 18
    glyphs: "0123456789° %/:-.,|#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜÉÈÇÀ+$"

# ============================================================================
# E-INK DISPLAY DRIVER (WAVESHARE 7.50IN V2 - 800x480)
# ============================================================================
display:
  - platform: waveshare_epaper
    id: eink_display
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      inverted: true
    model: 7.50inv2
    update_interval: never
    rotation: 0
    lambda: |-
      Color c_bg = id(dark_mode) ? COLOR_ON : COLOR_OFF;
      Color c_fg = id(dark_mode) ? COLOR_OFF : COLOR_ON;
      it.fill(c_bg);

      int mod = id(active_module_index);

      // Current time from RTC / SNTP
      auto time_now = id(sntp_time).now();
      if (!time_now.is_valid()) {
        time_now = id(pcf_rtc).now();
      }
      int cur_hour = time_now.hour;
      int cur_min = time_now.minute;
      int cur_day = time_now.day_of_month;
      int cur_month = time_now.month;
      int cur_day_of_week = time_now.day_of_week;

      // ============================================================================
      // MODULE 0: NATIVE WEATHER DASHBOARD
      // ============================================================================
      if (mod == 0) {
        int margin_x = 20;

        // Top Header (Left: Location & Current Temp)
        it.printf(margin_x, 14, id(font_title), c_fg, "%s", id(loc_name).c_str());

        int temp_val = id(cur_temp_c);
        if (id(use_fahrenheit)) temp_val = (int)((temp_val * 9.0f / 5.0f) + 32.0f);
        it.printf(margin_x, 44, id(font_huge), c_fg, "%d°%s", temp_val, id(use_fahrenheit) ? "F" : "C");

        // Header Subtitle: Condition, Humidity (Font >= 18px)
        const char* cond_label = "Mainly Clear";
        int w_code = id(cur_weather_code);
        if (w_code == 0) cond_label = "Clear Sky";
        else if (w_code == 1 || w_code == 2) cond_label = "Partly Cloudy";
        else if (w_code == 3) cond_label = "Overcast";
        else if (w_code >= 45 && w_code <= 48) cond_label = "Foggy";
        else if (w_code >= 51 && w_code <= 67) cond_label = "Rain Showers";
        else if (w_code >= 71 && w_code <= 77) cond_label = "Snow";
        else if (w_code >= 80 && w_code <= 82) cond_label = "Heavy Rain";
        else if (w_code >= 95) cond_label = "Thunderstorm";

        it.printf(margin_x, 108, id(font_body), c_fg, "%s  |  Humidity: %d%%", cond_label, id(cur_humidity));

        // Top Header (Right: Live Clock & Date)
        char time_str[16];
        if (id(use_24h_time)) {
          snprintf(time_str, sizeof(time_str), "%02d:%02d", cur_hour, cur_min);
        } else {
          int h12 = cur_hour % 12;
          if (h12 == 0) h12 = 12;
          snprintf(time_str, sizeof(time_str), "%d:%02d %s", h12, cur_min, cur_hour >= 12 ? "PM" : "AM");
        }
        it.printf(800 - margin_x, 14, id(font_large), c_fg, TextAlign::TOP_RIGHT, "%s", time_str);

        static const char* days_full[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
        static const char* months_full[] = {"", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
        int d_idx = (cur_day_of_week >= 1 && cur_day_of_week <= 7) ? (cur_day_of_week - 1) : 0;
        int m_idx = (cur_month >= 1 && cur_month <= 12) ? cur_month : 1;
        it.printf(800 - margin_x, 68, id(font_subtitle), c_fg, TextAlign::TOP_RIGHT, "%s, %s %d", days_full[d_idx], months_full[m_idx], cur_day);

        // Header Divider Line
        it.line(margin_x, 136, 800 - margin_x, 136, c_fg);

        // 5-Day Forecast Grid Cards
        int card_w = 140;
        int card_h = 260;
        int card_gap = 15;
        int start_x = margin_x;
        int body_y = 150;

        int card_codes[5] = {id(fc_code_0), id(fc_code_1), id(fc_code_2), id(fc_code_3), id(fc_code_4)};
        int card_max_c[5] = {id(fc_max_0), id(fc_max_1), id(fc_max_2), id(fc_max_3), id(fc_max_4)};
        int card_min_c[5] = {id(fc_min_0), id(fc_min_1), id(fc_min_2), id(fc_min_3), id(fc_min_4)};
        static const char* day_abbrs[] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};

        for (int i = 0; i < 5; i++) {
          int cx = start_x + i * (card_w + card_gap);
          it.rectangle(cx, body_y, card_w, card_h, c_fg);

          // Card Day Name
          if (i == 0) {
            it.printf(cx + card_w / 2, body_y + 12, id(font_subtitle), c_fg, TextAlign::TOP_CENTER, "TODAY");
          } else {
            int d_name_idx = (cur_day_of_week - 1 + i) % 7;
            it.printf(cx + card_w / 2, body_y + 12, id(font_subtitle), c_fg, TextAlign::TOP_CENTER, "%s", day_abbrs[d_name_idx]);
          }

          // Card Date (Font >= 18px)
          it.printf(cx + card_w / 2, body_y + 36, id(font_body), c_fg, TextAlign::TOP_CENTER, "%d %s", cur_day + i, months_full[m_idx]);

          // Weather Icon
          int img_x = cx + (card_w - 42) / 2;
          int img_y = body_y + 64;
          int code = card_codes[i];
          if (code == 0) it.image(img_x, img_y, id(img_sun));
          else if (code == 1 || code == 2) it.image(img_x, img_y, id(img_cloud_sun));
          else if (code == 3) it.image(img_x, img_y, id(img_cloud));
          else if (code >= 51 && code <= 67) it.image(img_x, img_y, id(img_cloud_rain));
          else if (code >= 71 && code <= 77) it.image(img_x, img_y, id(img_cloud_snow));
          else if (code >= 80 && code <= 82) it.image(img_x, img_y, id(img_cloud_rain));
          else if (code >= 95) it.image(img_x, img_y, id(img_cloud_lightning));
          else it.image(img_x, img_y, id(img_cloud));

          // Condition Name (Font >= 18px)
          const char* c_name = "Clear";
          if (code == 1 || code == 2) c_name = "Partly";
          else if (code == 3) c_name = "Overcast";
          else if (code >= 51 && code <= 67) c_name = "Rain";
          else if (code >= 80 && code <= 82) c_name = "Showers";
          else if (code >= 95) c_name = "Storm";
          it.printf(cx + card_w / 2, body_y + 122, id(font_body), c_fg, TextAlign::TOP_CENTER, "%s", c_name);

          // Temps High / Low
