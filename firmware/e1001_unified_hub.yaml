          bool is_pos = items[i].change >= 0;
          int badge_w = 120;
          int badge_h = 42;
          int badge_x = 800 - margin_x - badge_w - 24;
          int badge_y = y + 30;

          it.rectangle(badge_x, badge_y, badge_w, badge_h, c_fg);
          it.printf(badge_x + badge_w / 2, badge_y + 10, id(font_body), c_fg, TextAlign::TOP_CENTER,
