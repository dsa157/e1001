      else if (mod == 2) {
        // Direct Framebuffer Accessor for Bitwise XOR
        struct EPBufferAccessor : public esphome::display::DisplayBuffer {
          static uint8_t *get_buf(esphome::display::Display *d) {
            return ((EPBufferAccessor *)(esphome::display::DisplayBuffer *)d)->buffer_;
          }
        };
        uint8_t *ep_buf = EPBufferAccessor::get_buf(&it);

        // Helper lambda: Draws 1-bit rotated glyph with bitwise XOR directly onto buffer
        auto draw_rotated_glyph_xor = [ep_buf](esphome::font::Font *fnt, uint32_t cp, int center_x, int center_y, float angle_deg) {
          if (ep_buf == nullptr) return;
          const auto *glyph = fnt->find_glyph(cp);
          if (!glyph || glyph->data == nullptr) return;
          int gw = glyph->width;
          int gh = glyph->height;
          if (gw <= 0 || gh <= 0) return;

          float rad = angle_deg * (float)(M_PI / 180.0f);
          float cos_a = cosf(rad);
          float sin_a = sinf(rad);
          float half_w = (float)gw / 2.0f;
          float half_h = (float)gh / 2.0f;

          const uint8_t *data = glyph->data;
          uint8_t mask = 0;
          uint8_t byte = 0;

          for (int gy = 0; gy < gh; gy++) {
            for (int gx = 0; gx < gw; gx++) {
              if (mask == 0) {
                mask = 0x80;
                byte = *data++;
              }
              bool is_on = (byte & mask) != 0;
              mask >>= 1;

              if (is_on) {
                float rx = (float)gx - half_w;
                float ry = (float)gy - half_h;
                int px = center_x + (int)roundf(rx * cos_a - ry * sin_a);
                int py = center_y + (int)roundf(rx * sin_a + ry * cos_a);

                if (px >= 0 && px < 800 && py >= 0 && py < 480) {
                  uint32_t pos = (px + py * 800) / 8;
                  uint8_t pmask = 0x80 >> (px & 7);
                  ep_buf[pos] ^= pmask;
                }
              }
            }
          }
        };

        // Dynamic Seed: Uses current live RTC/SNTP timestamp and second count every display cycle
        uint32_t current_seed = (uint32_t)time_now.timestamp;
        if (current_seed == 0) {
          current_seed = (uint32_t)(cur_hour * 3600 + cur_min * 60 + time_now.second + 1001) ^ (uint32_t)millis();
        }
        current_seed ^= (uint32_t)id(art_seed);
        uint32_t rng_state = current_seed;
        auto next_rand = [&rng_state]() -> float {
          rng_state = rng_state * 1664525u + 1013904223u;
          return (float)(rng_state & 0x7FFFFFFF) / 2147483647.0f;
        };
        auto rand_int = [&next_rand](int min_val, int max_val) -> int {
          return min_val + (int)(next_rand() * (float)(max_val - min_val + 1));
        };

        const int x_spacing = 80;
        const int y_spacing = 80;
        const int cols = 800 / x_spacing; // 10
        const int rows = 480 / y_spacing; // 6
        const int margin_x = (800 - (cols * x_spacing)) / 2 + (x_spacing / 2);
        const int margin_y = (480 - (rows * y_spacing)) / 2 + (y_spacing / 2);

        // Unicode codepoints for: 'ë', 'ö', 'ä', 'ü'
        static const uint32_t umlaut_cps[4] = {0x00EB, 0x00F6, 0x00E4, 0x00FC};
        bool use_impact = (rand_int(0, 1) == 0);
        auto active_font = use_impact ? id(font_umlaut_impact) : id(font_umlaut_arial);

        for (int r = 0; r < rows; r++) {
          for (int c = 0; c < cols; c++) {
            int cx = margin_x + (c * x_spacing);
            int cy = margin_y + (r * y_spacing);
            int l_idx = rand_int(0, 3);
            float angle = next_rand() * 360.0f;

            draw_rotated_glyph_xor(active_font, umlaut_cps[l_idx], cx, cy, angle);
          }
        }
      }

