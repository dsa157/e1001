      // ============================================================================
      // MODULE 3: NATIVE GENERATIVE ART (Full-bleed, clean, zero header text)
      // ============================================================================
      else if (mod == 3) {
        int cx = 400;
        int cy = 240;
        int s = id(art_seed);
        int style = id(art_design_idx) % 3;

        if (style == 0) {
          // Style 0: Harmonic Contours
          int levels = 35 + (s % 30);
          int angle_steps = 180 + ((s * 7) % 60);
          float seed_phase = (float)(s % 1000) * 0.00628f;

          for (int l = 0; l < levels; l++) {
            float t_norm = (float)(l + 1) / (float)levels;
            float a_base = 15.0f + t_norm * 360.0f;
            float b_base = 10.0f + t_norm * 210.0f;
            int prev_x = 0, prev_y = 0;
            bool has_prev = false;

            for (int i = 0; i <= angle_steps; i++) {
              float theta = (2.0f * (float)M_PI / (float)angle_steps) * (float)i;
              float w1 = sinf(theta * 5.0f + (float)l * 0.35f + seed_phase) * cosf(theta * 3.0f + seed_phase) * 14.0f * t_norm;
              float w2 = sinf(theta * 2.0f + (float)l * 0.18f - seed_phase) * 10.0f * t_norm;

              int px = cx + (int)(cosf(theta) * (a_base + w1 + w2));
              int py = cy + (int)(sinf(theta) * (b_base + w1));

              if (px >= 0 && px < 800 && py >= 0 && py < 480) {
                if (has_prev) {
                  it.line(prev_x, prev_y, px, py, c_fg);
                }
                prev_x = px;
                prev_y = py;
                has_prev = true;
              } else {
                has_prev = false;
              }
            }
          }
        } else if (style == 1) {
          // Style 1: Harmonic Rings & Wave Harmonics
          int rings = 32;
          for (int r = 1; r <= rings; r++) {
            float rad = r * 7.5f;
            int prev_x = 0, prev_y = 0;
            bool has_prev = false;
            for (float a = 0; a <= (float)(M_PI * 2.0); a += 0.05f) {
              float deform = sinf(a * 6.0f + r * 0.3f) * (5.0f + r * 0.35f) + cosf(a * 4.0f) * 4.0f;
              int px = cx + (int)(cosf(a) * (rad + deform));
              int py = cy + (int)(sinf(a) * (rad + deform));
              if (has_prev) it.line(prev_x, prev_y, px, py, c_fg);
              prev_x = px;
              prev_y = py;
              has_prev = true;
            }
          }
        } else {
          // Style 2: Topological Sacred Rosette
          int petals = 8 + (s % 8);
          for (int r = 2; r <= 28; r++) {
            float rad_base = r * 8.0f;
            int prev_x = 0, prev_y = 0;
            bool has_prev = false;
            for (float a = 0; a <= (float)(M_PI * 2.0); a += 0.04f) {
              float r_mod = rad_base + sinf(a * (float)petals + (float)r * 0.2f) * (rad_base * 0.25f);
              int px = cx + (int)(cosf(a) * r_mod);
              int py = cy + (int)(sinf(a) * r_mod);
              if (has_prev) it.line(prev_x, prev_y, px, py, c_fg);
              prev_x = px;
              prev_y = py;
              has_prev = true;
            }
          }
        }
      }
