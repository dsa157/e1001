          // Symbol (Font 24px) & Name (Font >= 18px)
          it.printf(margin_x + 24, y + 22, id(font_title), c_fg, "%s", items[i].sym);
          it.printf(margin_x + 24, y + 58, id(font_body), c_fg, "%s", items[i].name);

          // Price
          char p_buf[32];
          if (items[i].price >= 1.0f) {
            snprintf(p_buf, sizeof(p_buf), "$%.2f", items[i].price);
          } else {
            snprintf(p_buf, sizeof(p_buf), "$%.4f", items[i].price);
