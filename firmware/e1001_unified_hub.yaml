# ============================================================================
# Seeed reTerminal E1001 - Unified Native ESPHome Multi-Module Dashboard
# Version: 2026.09.29.19.15.00
# Description: 100% Autonomous, on-device multi-module dashboard for Seeed E1001
#              (ESP32-S3 + Waveshare 7.50in V2 800x480 e-paper display).
#              Runs 100% standalone without any computer or host server.
#
# Integrated Modules:
#   Module 0: Live Open-Meteo Weather Dashboard (5-Day Outlook + SVG Icons)
#   Module 1: Authentic Typographic QLOCKTWO Word Clock (6 Languages + RTC Sync)
#   Module 2: Cryptocurrency Asset Market Tracker (Spot Quotes & 24h Deltas)
#   Module 3: Algorithmic Generative Art (Harmonics, Streamlines, Rosettes)
#
# Hardware Button Controls:
#   - GPIO4 (Next Button):   Switch to Next Module
#   - GPIO5 (Prev Button):   Switch to Previous Module
#   - GPIO3 (Action Button): Short press: Sub-module toggle (°C/°F, Lang, Invert, New Seed)
#                            Long press (>600ms): Pause / Resume Auto-Cycling
# ============================================================================

substitutions:
  name: "seeed-e1001-unified-hub"
  friendly_name: "Seeed E1001 Unified Hub"
  default_lat: "21.0285"
  default_lon: "105.8542"
  default_city: "Hanoi, VN"
  cycle_interval: "30s"
  use_fahrenheit_val: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - output.turn_on: sd_cs_pin
      - output.turn_off: sd_en_pin
      - output.turn_on: batt_en_pin
      - delay: 300ms
      - pcf8563.read_time:
      - delay: 300ms
      - component.update: batt_voltage
      - delay: 200ms
      - component.update: eink_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# ============================================================================
# GLOBAL STATE VARIABLES (ZERO MAGIC NUMBERS)
# ============================================================================
globals:
  # Active Display Module (0: Weather, 1: QLOCKTWO, 2: Crypto, 3: Generative Art)
  - id: active_module_index
    type: int
    restore_value: true
    initial_value: '0'

  # Auto-cycle between modules (Autonomous 30s dwell)
  - id: auto_cycle_enabled
    type: bool
    restore_value: false
    initial_value: 'true'

  # Universal Inverted / Dark Theme Toggle
  - id: dark_mode
    type: bool
    restore_value: true
    initial_value: 'false'

  # Clock & Unit Format Preferences
  - id: use_24h_time
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: use_fahrenheit
    type: bool
    restore_value: false
    initial_value: '${use_fahrenheit_val}'

  # QLOCKTWO Language (0: EN, 1: DE, 2: FR, 3: ES, 4: IT, 5: NL)
  - id: qlock_lang_idx
    type: int
    restore_value: true
    initial_value: '0'

  # Generative Art State
  - id: art_design_idx
    type: int
    restore_value: true
    initial_value: '0'
  - id: art_seed
    type: int
    restore_value: true
    initial_value: '1001'

  # Weather Module Dynamic State
  - id: loc_name
    type: std::string
    restore_value: true
    initial_value: '"${default_city}"'
  - id: cur_temp_c
    type: int
    initial_value: '28'
  - id: cur_weather_code
    type: int
    initial_value: '1'
  - id: cur_humidity
    type: int
    initial_value: '68'
  - id: fc_max_0
    type: int
    initial_value: '31'
  - id: fc_max_1
    type: int
    initial_value: '30'
  - id: fc_max_2
    type: int
    initial_value: '29'
  - id: fc_max_3
    type: int
    initial_value: '32'
  - id: fc_max_4
    type: int
    initial_value: '31'
  - id: fc_min_0
    type: int
    initial_value: '24'
  - id: fc_min_1
    type: int
    initial_value: '24'
  - id: fc_min_2
    type: int
    initial_value: '23'
  - id: fc_min_3
    type: int
    initial_value: '24'
  - id: fc_min_4
    type: int
    initial_value: '25'
  - id: fc_code_0
    type: int
    initial_value: '1'
  - id: fc_code_1
    type: int
    initial_value: '2'
  - id: fc_code_2
    type: int
    initial_value: '61'
  - id: fc_code_3
    type: int
    initial_value: '80'
  - id: fc_code_4
    type: int
    initial_value: '3'

  # Crypto Module Dynamic State (Supports up to 6 coins)
  - id: btc_price
    type: float
    initial_value: '84250.0'
  - id: btc_change_24h
    type: float
    initial_value: '2.01'
  - id: eth_price
    type: float
    initial_value: '2718.5'
  - id: eth_change_24h
    type: float
    initial_value: '3.05'
  - id: sol_price
    type: float
    initial_value: '158.20'
  - id: sol_change_24h
    type: float
    initial_value: '4.80'
  - id: ada_price
    type: float
    initial_value: '0.254'
  - id: ada_change_24h
    type: float
    initial_value: '4.64'
  - id: bnb_price
    type: float
    initial_value: '585.50'
  - id: bnb_change_24h
    type: float
    initial_value: '1.20'
  - id: xrp_price
    type: float
    initial_value: '0.592'
  - id: xrp_change_24h
    type: float
    initial_value: '-0.45'

# ============================================================================
# LOGGING & WI-FI SETUP
# ============================================================================
logger:
  hardware_uart: UART0
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "E1001-Hub-Fallback"
    password: "fallbackpassword"
  on_connect:
    then:
      - delay: 1s
      # 1. IP Geolocation for Weather
      - http_request.get:
          url: "http://ip-api.com/json"
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject doc) {
                    if (doc["city"].is<const char*>() && doc["countryCode"].is<const char*>()) {
                      std::string city = doc["city"].as<std::string>();
                      std::string cc = doc["countryCode"].as<std::string>();
                      id(loc_name) = city + ", " + cc;
                    }
                    if (doc["lat"].is<float>() && doc["lon"].is<float>()) {
                      float lat = doc["lat"].as<float>();
                      float lon = doc["lon"].as<float>();
                      char url_buf[256];
                      snprintf(url_buf, sizeof(url_buf),
                               "http://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto",
                               lat, lon);
                      id(fetch_weather_script).execute(std::string(url_buf));
                    }
                    return true;
                  });
      # 2. Fetch Crypto Quotes
      - script.execute: fetch_crypto_script

captive_portal:

# ============================================================================
# HTTP REST API CLIENT & SCRIPTS (Large buffer to receive full CMC quotes)
# ============================================================================
http_request:
  id: http_client
  verify_ssl: false
  timeout: 15s
  buffer_size_rx: 8192

script:
  # Fetch Open-Meteo Weather Data
  - id: fetch_weather_script
    mode: restart
    parameters:
      weather_url: string
    then:
      - http_request.get:
          url: !lambda return weather_url;
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject doc) {
                    if (doc["current"].is<JsonObject>()) {
                      auto cur = doc["current"];
                      id(cur_temp_c) = (int)round(cur["temperature_2m"].as<float>());
                      id(cur_humidity) = (int)round(cur["relative_humidity_2m"].as<float>());
                      id(cur_weather_code) = cur["weather_code"].as<int>();
                    }
                    if (doc["daily"].is<JsonObject>()) {
                      auto daily = doc["daily"];
                      auto codes = daily["weather_code"].as<JsonArray>();
                      auto t_max = daily["temperature_2m_max"].as<JsonArray>();
                      auto t_min = daily["temperature_2m_min"].as<JsonArray>();
                      if (codes.size() >= 5) {
                        id(fc_code_0) = codes[0].as<int>();
                        id(fc_code_1) = codes[1].as<int>();
                        id(fc_code_2) = codes[2].as<int>();
                        id(fc_code_3) = codes[3].as<int>();
                        id(fc_code_4) = codes[4].as<int>();
                      }
                      if (t_max.size() >= 5) {
                        id(fc_max_0) = (int)round(t_max[0].as<float>());
                        id(fc_max_1) = (int)round(t_max[1].as<float>());
                        id(fc_max_2) = (int)round(t_max[2].as<float>());
                        id(fc_max_3) = (int)round(t_max[3].as<float>());
                        id(fc_max_4) = (int)round(t_max[4].as<float>());
                      }
                      if (t_min.size() >= 5) {
                        id(fc_min_0) = (int)round(t_min[0].as<float>());
                        id(fc_min_1) = (int)round(t_min[1].as<float>());
                        id(fc_min_2) = (int)round(t_min[2].as<float>());
                        id(fc_min_3) = (int)round(t_min[3].as<float>());
                        id(fc_min_4) = (int)round(t_min[4].as<float>());
                      }
                    }
                    return true;
                  });
              - if:
                  condition:
                    lambda: 'return id(active_module_index) == 0;'
                  then:
                    - component.update: eink_display

  # Fetch Crypto Quotes from CoinMarketCap (up to 6 coins with 8KB response buffer)
  - id: fetch_crypto_script
    mode: restart
    then:
      - http_request.get:
          url: "https://pro-api.coinmarketcap.com/v1/cryptocurrency/quotes/latest?symbol=BTC,ETH,SOL,ADA,BNB,XRP"
          request_headers:
            X-CMC_PRO_API_KEY: !secret cmc_api_key
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject doc) {
                    if (doc["data"].is<JsonObject>()) {
                      auto data = doc["data"];
                      if (data["BTC"].is<JsonObject>()) {
                        auto btc = data["BTC"]["quote"]["USD"];
                        id(btc_price) = btc["price"].as<float>();
                        id(btc_change_24h) = btc["percent_change_24h"].as<float>();
                      }
                      if (data["ETH"].is<JsonObject>()) {
                        auto eth = data["ETH"]["quote"]["USD"];
                        id(eth_price) = eth["price"].as<float>();
                        id(eth_change_24h) = eth["percent_change_24h"].as<float>();
                      }
                      if (data["SOL"].is<JsonObject>()) {
                        auto sol = data["SOL"]["quote"]["USD"];
                        id(sol_price) = sol["price"].as<float>();
                        id(sol_change_24h) = sol["percent_change_24h"].as<float>();
                      }
                      if (data["ADA"].is<JsonObject>()) {
                        auto ada = data["ADA"]["quote"]["USD"];
                        id(ada_price) = ada["price"].as<float>();
                        id(ada_change_24h) = ada["percent_change_24h"].as<float>();
                      }
                      if (data["BNB"].is<JsonObject>()) {
                        auto bnb = data["BNB"]["quote"]["USD"];
                        id(bnb_price) = bnb["price"].as<float>();
                        id(bnb_change_24h) = bnb["percent_change_24h"].as<float>();
                      }
                      if (data["XRP"].is<JsonObject>()) {
                        auto xrp = data["XRP"]["quote"]["USD"];
                        id(xrp_price) = xrp["price"].as<float>();
                        id(xrp_change_24h) = xrp["percent_change_24h"].as<float>();
                      }
                    }
                    return true;
                  });
              - if:
                  condition:
                    lambda: 'return id(active_module_index) == 1;'
                  then:
                    - component.update: eink_display

# ============================================================================
# HARDWARE PINS & BUSES
# ============================================================================
output:
  - platform: gpio
    pin: GPIO14
    id: sd_cs_pin
  - platform: gpio
    pin: GPIO16
    id: sd_en_pin
  - platform: gpio
    pin: GPIO21
    id: batt_en_pin

# NXP PCF8563 Real-Time Clock I2C Bus
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true
  id: bus_a

time:
  # Hardware PCF8563 RTC Driver
  - platform: pcf8563
    id: pcf_rtc
    i2c_id: bus_a
    address: 0x51

  # Network SNTP Time Sync (Timezone: Asia/Bangkok)
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com
    on_time_sync:
      then:
        - pcf8563.write_time:
        - delay: 500ms
        - component.update: eink_display
    on_time:
      # Top of the minute clock refresh (:00s)
      - seconds: 0
        then:
          - lambda: |-
              // If auto-cycle is paused and showing QLOCKTWO word clock (Module 3), keep time accurate
              if (!id(auto_cycle_enabled) && id(active_module_index) == 3) {
                id(eink_display).update();
              }
      # Periodic weather refresh every 15 minutes
      - minutes: "/15"
        seconds: 10
        then:
          - script.execute:
              id: fetch_weather_script
              weather_url: "http://api.open-meteo.com/v1/forecast?latitude=${default_lat}&longitude=${default_lon}&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto"
      # Periodic crypto refresh every 5 minutes
      - minutes: "/5"
        seconds: 25
        then:
          - script.execute: fetch_crypto_script

# Autonomous Periodic Auto-Cycle Timer (30s)
interval:
  - interval: ${cycle_interval}
    then:
      - lambda: |-
          if (id(auto_cycle_enabled)) {
            id(active_module_index) = (id(active_module_index) + 1) % 5;
            ESP_LOGI("AUTOCYCLE", "Autonomous cycle -> Active Module: %d", id(active_module_index));
            id(eink_display).update();
          }

# Hardware Battery ADC Sensor
sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: batt_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0

  - platform: template
    name: "Battery Percentage"
    id: batt_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    update_interval: 60s
    lambda: |-
      if (!id(batt_voltage).has_state()) return 85.0f;
      float v = id(batt_voltage).state;
      if (isnan(v) || v <= 0.2f) return 85.0f;
      if (v < 2.5f) v = v * 2.0f;
      if (v >= 4.15f) return 100.0f;
      if (v <= 3.30f) return 5.0f;
      float pct = ((v - 3.30f) / (4.15f - 3.30f)) * 100.0f;
      return (float)std::max(5.0f, std::min(100.0f, pct));

# ============================================================================
# PHYSICAL HARDWARE BUTTONS
# ============================================================================
binary_sensor:
  # Next Button (GPIO4): Advance to Next Module
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Next Button"
    on_press:
      then:
        - lambda: |-
            id(active_module_index) = (id(active_module_index) + 1) % 5;
            ESP_LOGI("BUTTON", "Next button pressed -> Module: %d", id(active_module_index));
        - component.update: eink_display

  # Prev Button (GPIO5): Return to Previous Module
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Prev Button"
    on_press:
      then:
        - lambda: |-
            id(active_module_index) = (id(active_module_index) + 4) % 5;
            ESP_LOGI("BUTTON", "Prev button pressed -> Module: %d", id(active_module_index));
        - component.update: eink_display

  # Action Button (GPIO3): Short Press = Module Action, Long Press (>600ms) = Pause/Resume Auto-Cycle
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Action Button"
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - lambda: |-
              int cur = id(active_module_index);
              if (cur == 0) {
                // Weather: Toggle °C / °F
                id(use_fahrenheit) = !id(use_fahrenheit);
              } else if (cur == 1) {
                // Crypto: Toggle Invert Theme
                id(dark_mode) = !id(dark_mode);
              } else if (cur == 2) {
                // Umlaut Art: Reseed
                id(art_seed) = (int)(esp_random() % 100000) + 1;
              } else if (cur == 3) {
                // Qlocktwo: Cycle Language
                id(qlock_lang_idx) = (id(qlock_lang_idx) + 1) % 6;
              } else if (cur == 4) {
                // Modular Grid Art: Reseed & Cycle Style
                id(art_design_idx) = (id(art_design_idx) + 1) % 3;
                id(art_seed) = (int)(esp_random() % 100000) + 1;
              }
          - component.update: eink_display
      - min_length: 600ms
        max_length: 4000ms
        then:
          - lambda: |-
              id(auto_cycle_enabled) = !id(auto_cycle_enabled);
              ESP_LOGI("BUTTON", "Auto-cycle toggled: %s", id(auto_cycle_enabled) ? "ON" : "OFF");
          - component.update: eink_display

